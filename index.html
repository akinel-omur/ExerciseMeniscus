<!--
  EGZERSİZ GÖRSELLERİ / VİDEOLARI
  -------------------------------
  Her egzersiz kartında bir POSTER (gerçek fotoğraf, yoksa animasyonlu SVG) ve
  üstünde bir ▶ oynat butonu gösterilir. Butona basınca o egzersizin YouTube
  videosu kart içinde (inline iframe) oynatılır.

  - Video ID'leri aşağıdaki JS içindeki VIDEOS tablosundadır. Bir videoyu
    değiştirmek için id'yi düzenle; kısa bir bölüme kırpmak için { start, end }
    (saniye) ekle. Örn: 'goblet-squat': { id: 'xxxx', start: 12, end: 30 }
  - Bir video gömülemez/silinmişse poster yerinde kalır; sadece o id'yi değiştir.

  Poster fotoğrafları: free-exercise-db (https://github.com/yuhonas/free-exercise-db)
    Lisans: The Unlicense (kamu malı). 12 hareket gerçek fotoğrafla gelir; 3 hareket
    (monster walk, shadow boxing, kuadriseps izometrik) animasyonlu SVG posterli.
  İstersen assets/gifs/{id}.gif ile kendi görselini de ekleyebilirsin (README'ye bak).
-->

  const YT_PARAMS = 'autoplay=1&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3';
  function ytEmbedUrl(v) {
    let u = `https://www.youtube.com/embed/${v.id}?${YT_PARAMS}`;
    if (v.start != null) u += `&start=${v.start}`;
    if (v.end != null) u += `&end=${v.end}`;
    return u;
  }

  const PROGRAM = [
    { key: 'warmup',   name: 'Isınma',                 minutes: 4,  met: 3.0,
      items: ['walk-in-place', 'monster-walk', 'calf-raises', 'quad-isometric'] },
    { key: 'strength', name: 'Blok 1 · Güç süperseti', minutes: 10, met: 5.0,
      rounds: 3, restSec: 30,
      items: ['goblet-squat', 'reverse-lunge', 'single-leg-glute-bridge'] },
    { key: 'hiit',     name: 'Blok 2 · HIIT',          minutes: 8,  met: 8.0,
      rounds: 2, workSec: 40, restSec: 20,
      items: ['kb-rdl', 'db-shadow-boxing', 'dead-bug', 'pallof-press'] },
    { key: 'finisher', name: 'Blok 3 · İzole bitirme', minutes: 3,  met: 3.5,
      sets: 2,
      items: ['band-leg-extension', 'prone-hamstring-curl',
              'seated-leg-curl', 'single-leg-calf-raises'] },
  ];

  const BIKE_MET = 7.0;

  const BLOCK_BY_KEY = Object.fromEntries(PROGRAM.map(b => [b.key, b]));

  function compileProgram() {
    const steps = [];

    // 1) Warmup
    PROGRAM[0].items.forEach(id => {
      const ex = EXERCISES[id];
      if (ex.mode === 'time') {
        steps.push({ kind: 'time', exerciseId: id, blockKey: 'warmup',
                     label: ex.name, sublabel: 'Süre', duration: ex.duration,
                     autoAdvance: true });
      } else if (ex.mode === 'reps') {
        steps.push({ kind: 'reps', exerciseId: id, blockKey: 'warmup',
                     label: ex.name, sublabel: ex.repText,
                     autoAdvance: false });
      } else if (ex.mode === 'hold') {
        steps.push({ kind: 'hold', exerciseId: id, blockKey: 'warmup',
                     label: ex.name, sublabel: `${ex.holdSec} sn × ${ex.rounds}`,
                     holdSec: ex.holdSec, rounds: ex.rounds, restBetween: ex.restBetween,
                     autoAdvance: true });
      }
    });

    // 2) Strength superset: rounds × items, rest between rounds
    const sb = PROGRAM[1];
    for (let r = 1; r <= sb.rounds; r++) {
      sb.items.forEach(id => {
        const ex = EXERCISES[id];
        steps.push({ kind: 'reps', exerciseId: id, blockKey: 'strength',
                     label: ex.name, sublabel: ex.repText,
                     round: r, totalRounds: sb.rounds, autoAdvance: false });
      });
      if (r < sb.rounds) {
        steps.push({ kind: 'rest', blockKey: 'strength',
                     label: 'Dinlenme', sublabel: `Tur ${r}/${sb.rounds} bitti — sıradaki tur`,
                     duration: sb.restSec, autoAdvance: true });
      }
    }

    // 3) HIIT: rounds × items × (work + rest)
    const hb = PROGRAM[2];
    for (let r = 1; r <= hb.rounds; r++) {
      hb.items.forEach((id, idx) => {
        const ex = EXERCISES[id];
        const nextId = hb.items[idx + 1] ||
                       (r < hb.rounds ? hb.items[0] : null);
        const nextName = nextId ? EXERCISES[nextId].name : 'Blok bitti';
        steps.push({ kind: 'work', exerciseId: id, blockKey: 'hiit',
                     label: ex.name, sublabel: 'Çalış',
                     duration: ex.workSec, round: r, totalRounds: hb.rounds,
                     autoAdvance: true });
        steps.push({ kind: 'rest', exerciseId: id, blockKey: 'hiit',
                     label: 'Dinlenme', sublabel: `Sıradaki: ${nextName}`,
                     duration: ex.restSec, round: r, totalRounds: hb.rounds,
                     autoAdvance: true });
      });
    }

    // 4) Finisher: items × sets
    const fb = PROGRAM[3];
    fb.items.forEach(id => {
      const ex = EXERCISES[id];
      for (let s = 1; s <= fb.sets; s++) {
        steps.push({ kind: 'reps', exerciseId: id, blockKey: 'finisher',
                     label: ex.name, sublabel: ex.repText || '15 tekrar',
                     set: s, totalSets: fb.sets, autoAdvance: false });
      }
    });

    steps.push({ kind: 'done', label: 'Antrenman Tamam!' });
    steps.forEach((s, i) => s.index = i);
    return steps;
  }

  // -----------------------------------------------------------------------------
  // STORE: localStorage
  // -----------------------------------------------------------------------------
  const Store = {
    KEY: 'meniscus.v1',
    cache: null,

    load() {
      if (Store.cache) return Store.cache;
      try {
        const raw = localStorage.getItem(Store.KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data && data.version === 1 && Array.isArray(data.completions)) {
            if (typeof data.weightKg !== 'number') data.weightKg = 70;
            Store.cache = data;
            return data;
          }
        }
      } catch (e) {}
      Store.cache = { version: 1, weightKg: 70, completions: [] };
      return Store.cache;
    },

    save() {
      try { localStorage.setItem(Store.KEY, JSON.stringify(Store.cache)); } catch (e) {}
    },

    getWeight() { return Store.load().weightKg; },
    setWeight(kg) {
      const n = Number(kg);
      if (!isFinite(n)) return;
      Store.load().weightKg = Math.max(20, Math.min(250, Math.round(n)));
      Store.save();
    },

    recordCompletion(type, durationSec, kcal) {
      const data = Store.load();
      const date = todayISO();
      const existing = data.completions.find(c => c.date === date && c.type === type);
      if (existing) {
        existing.durationSec += Math.round(durationSec);
        existing.kcal = Math.round((existing.kcal || 0) + kcal);
      } else {
        data.completions.push({
          date, type,
          durationSec: Math.round(durationSec),
          kcal: Math.round(kcal),
        });
      }
      Store.save();
    },

    getStats() {
      const data = Store.load();
      const totalWorkouts = data.completions.filter(c => c.type === 'workout').length;
      const totalBike = data.completions.filter(c => c.type === 'bike').length;
      const totalKcal = data.completions.reduce((s, c) => s + (c.kcal || 0), 0);
      const totalDuration = data.completions.reduce((s, c) => s + (c.durationSec || 0), 0);
      return {
        totalWorkouts, totalBike, totalKcal, totalDuration,
        weekKcal: Store.weekKcal(),
        streak: Store.computeStreak(),
      };
    },

    weekKcal() {
      const data = Store.load();
      const monday = Store.mondayISO(new Date());
      return data.completions
        .filter(c => c.date >= monday)
        .reduce((s, c) => s + (c.kcal || 0), 0);
    },

    computeStreak() {
      const data = Store.load();
      const set = new Set(data.completions.map(c => c.date));
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const todayStr = isoOf(today);
      let streak = 0;
      for (let i = 0; i < 365; i++) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        const iso = isoOf(d);
        const dow = d.getDay(); // 0=Sun, 4=Thu
        const isRest = (dow === 4 || dow === 0);
        if (set.has(iso)) { streak++; continue; }
        if (isRest) continue;
        if (iso === todayStr) continue;
        break;
      }
      return streak;
    },

    mondayISO(d) {
      const date = new Date(d); date.setHours(0, 0, 0, 0);
      const dow = (date.getDay() + 6) % 7; // Mon=0
      date.setDate(date.getDate() - dow);
      return isoOf(date);
    },

    weekHeatmap() {
      const data = Store.load();
      const map = {};
      data.completions.forEach(c => {
        if (!map[c.date]) map[c.date] = new Set();
        map[c.date].add(c.type);
      });
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const todayStr = isoOf(today);
      const monday = new Date(today);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      const cells = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday); d.setDate(d.getDate() + i);
        const iso = isoOf(d);
        const dow = d.getDay();
        const isRest = (dow === 4 || dow === 0);
        const isToday = (iso === todayStr);
        const isPast = (iso < todayStr);
        let state;
        if (map[iso]) state = 'done';
        else if (isRest) state = 'rest';
        else if (isToday) state = 'today';
        else if (isPast) state = 'missed';
        else state = 'upcoming';
        cells.push({ iso, dow, state, types: map[iso] ? Array.from(map[iso]) : [] });
      }
      return cells;
    },

    monthHeatmap(weeks = 8) {
      const data = Store.load();
      const map = {};
      data.completions.forEach(c => { map[c.date] = true; });
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const start = new Date(today);
      start.setDate(start.getDate() - (weeks * 7 - 1));
      // Align to Monday
      while (((start.getDay() + 6) % 7) !== 0) {
        start.setDate(start.getDate() - 1);
      }
      const cells = [];
      const total = Math.ceil((today - start) / 86400000) + 1;
      for (let i = 0; i < total; i++) {
        const d = new Date(start); d.setDate(d.getDate() + i);
        const iso = isoOf(d);
        cells.push({ iso, dow: d.getDay(), done: !!map[iso] });
      }
      return cells;
    },
  };

  // -----------------------------------------------------------------------------
  // FX: wake lock / vibration / web audio (all capability-gated)
  // -----------------------------------------------------------------------------
  const FX = {
    wakeLock: null,
    _ctx: null,

    async requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try { FX.wakeLock = await navigator.wakeLock.request('screen'); }
      catch (e) { /* ignore */ }
    },

    async releaseWakeLock() {
      try { await FX.wakeLock?.release(); } catch (e) {}
      FX.wakeLock = null;
    },

    vibrate(pattern) {
      if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
    },

    ensureAudio() {
      if (!FX._ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          try { FX._ctx = new AC(); } catch (e) {}
        }
      }
      if (FX._ctx && FX._ctx.state === 'suspended') {
        FX._ctx.resume().catch(() => {});
      }
    },

    beep(freq, ms) {
      const ctx = FX._ctx;
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(ctx.destination);
        const t = ctx.currentTime;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
        osc.start(t);
        osc.stop(t + ms / 1000 + 0.05);
      } catch (e) {}
    },

    signalEnd()   { FX.beep(880, 220); setTimeout(() => FX.beep(1175, 260), 230); FX.vibrate([220, 90, 220]); },
    signalWork()  { FX.beep(740, 160); FX.vibrate(150); },
    signalRest()  { FX.beep(440, 160); FX.vibrate(90); },
    signalFinish(){ FX.beep(880, 200); setTimeout(() => FX.beep(1100, 200), 210); setTimeout(() => FX.beep(1320, 320), 430); FX.vibrate([300, 100, 300, 100, 500]); },
  };

  // -----------------------------------------------------------------------------
  // UTILITIES
  // -----------------------------------------------------------------------------
  function isoOf(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function todayISO() { return isoOf(new Date()); }

  function fmtMMSS(secs) {
    secs = Math.max(0, Math.round(secs));
    const m = Math.floor(secs / 60), s = secs % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  function fmtDuration(secs) {
    secs = Math.round(secs);
    if (secs < 60) return `${secs} sn`;
    const m = Math.floor(secs / 60), s = secs % 60;
    return s ? `${m} dk ${s} sn` : `${m} dk`;
  }

  const TR_DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  const TR_DAYS_SHORT = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];

  function scheduledType(dow) {
    // 1 Mon, 3 Wed, 5 Fri = workout; 2 Tue, 6 Sat = bike; 4 Thu, 0 Sun = rest
    if (dow === 1 || dow === 3 || dow === 5) return 'workout';
    if (dow === 2 || dow === 6) return 'bike';
    return 'rest';
  }
  const TYPE_TR = { workout: 'Antrenman', bike: 'Bisiklet', rest: 'Dinlenme' };

  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (v === false || v == null) {/* skip */}
      else e.setAttribute(k, v);
    }
    if (!Array.isArray(children)) children = [children];
    children.forEach(c => {
      if (c == null || c === false) return;
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  // No-ops kept so existing call sites stay valid (videos load lazily on tap)
  function clearGifTimerOn() {}
  function clearAllGifTimers() {}

  function preloadGif(exerciseId) {

    if (ex && ex.frames) { const i = new Image(); i.src = ex.frames[0]; }

  // -----------------------------------------------------------------------------
  // ENGINE: workout / bike timer
  // -----------------------------------------------------------------------------
  const Engine = {
    steps: [], stepIndex: 0,
    running: false, paused: false,
    endsAt: 0, remainingFrozen: 0,
    rafId: null,
    subRound: 1, inHoldRest: false,
    startedAt: 0,
    ui: {},   // cached refs for active screen
    mode: null, // 'workout' | 'bike'

    // ---- WORKOUT ----
    startWorkout() {
      Engine.mode = 'workout';
      Engine.steps = compileProgram();
      Engine.stepIndex = 0;
      Engine.running = true;
      Engine.paused = false;
      Engine.startedAt = Date.now();
      FX.ensureAudio();
      FX.requestWakeLock();
      Screens.mountActive();
      Engine.enterStep(0);
    },

    enterStep(i) {
      Engine.cancelLoop();
      if (i < 0) i = 0;
      if (i >= Engine.steps.length) i = Engine.steps.length - 1;
      Engine.stepIndex = i;
      const step = Engine.steps[i];

      // Preload next exercise GIF if any
      const next = Engine.steps[i + 1];
      if (next && next.exerciseId) preloadGif(next.exerciseId);

      if (step.kind === 'done') {
        Engine.finishWorkout();
        return;
      }

      // Reset hold sub-state on entry
      if (step.kind === 'hold') {
        Engine.subRound = 1;
        Engine.inHoldRest = false;
      }

      Screens.renderActiveStep(step);

      if (step.kind === 'reps') {
        // No timer; user will tap "Bitti"
        return;
      }

      // Phase-start cue: distinct beep for work vs rest
      if (step.kind === 'work') FX.signalWork();
      if (step.kind === 'rest') FX.signalRest();

      if (step.kind === 'hold') {
        Engine.startCountdown(step.holdSec);
      } else {
        Engine.startCountdown(step.duration);
      }
    },

    startCountdown(secs) {
      Engine.endsAt = Date.now() + secs * 1000;
      Engine.loop();
    },

    loop() {
      if (!Engine.running || Engine.paused) return;
      const remainingMs = Engine.endsAt - Date.now();
      if (remainingMs <= 0) {
        Engine.onTimerComplete();
        return;
      }
      Screens.updateCountdown(Math.ceil(remainingMs / 1000));
      Engine.rafId = requestAnimationFrame(Engine.loop);
    },

    onTimerComplete() {
      Engine.cancelLoop();
      const step = Engine.steps[Engine.stepIndex];

      if (step.kind === 'hold') {
        if (!Engine.inHoldRest) {
          // finished a 10s hold
          if (Engine.subRound >= step.rounds) {
            FX.signalEnd();
            Engine.next();
            return;
          }
          // signal end of this hold (short cue), then rest between
          FX.signalRest();
          Engine.inHoldRest = true;
          Screens.updateCountdown(step.restBetween);
          Engine.startCountdown(step.restBetween);
          return;
        } else {
          // finished rest between holds
          Engine.subRound++;
          Engine.inHoldRest = false;
          FX.signalWork();
          Screens.renderActiveStep(step); // refresh subRound display
          Engine.startCountdown(step.holdSec);
          return;
        }
      }

      // For all other timed kinds, beep + advance
      FX.signalEnd();
      Engine.next();
    },

    cancelLoop() {
      if (Engine.rafId) cancelAnimationFrame(Engine.rafId);
      Engine.rafId = null;
    },

    next() { Engine.enterStep(Engine.stepIndex + 1); },
    prev() {
      // From mid-step: restart current; if already at start, go to previous
      const step = Engine.steps[Engine.stepIndex];
      if (step && (step.kind === 'time' || step.kind === 'work' ||
                   step.kind === 'rest' || step.kind === 'hold')) {
        const remainingMs = Engine.endsAt - Date.now();
        const total = step.kind === 'hold' ?
          (Engine.inHoldRest ? step.restBetween : step.holdSec) :
          step.duration;
        const elapsed = total * 1000 - remainingMs;
        if (elapsed > 3000) {
          // restart current step from scratch
          Engine.enterStep(Engine.stepIndex);
          return;
        }
      }
      Engine.enterStep(Engine.stepIndex - 1);
    },
    skip() { Engine.next(); },

    swapCurrentExercise() {
      const step = Engine.steps[Engine.stepIndex];
      if (!step || !step.exerciseId) return;
      const altId = ALTERNATIVES[step.exerciseId];
      if (!altId || !EXERCISES[altId]) return;
      const origId = step.exerciseId;
      const altEx = EXERCISES[altId];
      // Replace all remaining steps (from current forward) that use the same exercise
      for (let i = Engine.stepIndex; i < Engine.steps.length; i++) {
        const s = Engine.steps[i];
        if (s.exerciseId !== origId) continue;
        s.exerciseId = altId;
        s.label = altEx.name;
        if (s.kind === 'reps') s.sublabel = altEx.repText || '';
      }
      Screens.renderActiveStep(Engine.steps[Engine.stepIndex]);
    },

    done() {
      const step = Engine.steps[Engine.stepIndex];
      if (step && step.kind === 'reps') Engine.next();
    },

    pause() {
      if (Engine.paused || !Engine.running) return;
      Engine.paused = true;
      const step = Engine.steps[Engine.stepIndex];
      if (step && step.kind !== 'reps' && step.kind !== 'done') {
        Engine.remainingFrozen = Math.max(0, Math.ceil((Engine.endsAt - Date.now()) / 1000));
      }
      Engine.cancelLoop();
      FX.releaseWakeLock();
      Screens.updatePauseUI(true);
    },

    resume() {
      if (!Engine.paused) return;
      Engine.paused = false;
      FX.requestWakeLock();
      const step = Engine.steps[Engine.stepIndex];
      if (step && step.kind !== 'reps' && step.kind !== 'done') {
        Engine.endsAt = Date.now() + Engine.remainingFrozen * 1000;
        Engine.loop();
      }
      Screens.updatePauseUI(false);
    },

    togglePause() { Engine.paused ? Engine.resume() : Engine.pause(); },

    // --- KCAL ---
    computeKcal() {
      const w = Store.getWeight();
      let total = 0;
      PROGRAM.forEach(b => { total += b.met * w * (b.minutes / 60); });
      return Math.round(total);
    },

    computeLiveKcal() {
      const w = Store.getWeight();
      // Map of block -> {done, total}
      const prog = {};
      PROGRAM.forEach(b => { prog[b.key] = { done: 0, total: 0 }; });
      Engine.steps.forEach((s, i) => {
        if (s.kind === 'done' || !s.blockKey) return;
        if (!prog[s.blockKey]) return;
        prog[s.blockKey].total++;
        if (i < Engine.stepIndex) prog[s.blockKey].done++;
      });
      let kcal = 0;
      PROGRAM.forEach(b => {
        const p = prog[b.key];
        const ratio = p.total > 0 ? p.done / p.total : 0;
        kcal += b.met * w * (b.minutes / 60) * ratio;
      });
      return Math.round(kcal);
    },

    finishWorkout() {
      Engine.cancelLoop();
      Engine.running = false;
      FX.releaseWakeLock();
      FX.signalFinish();
      const durationSec = Math.round((Date.now() - Engine.startedAt) / 1000);
      const kcal = Engine.computeKcal();
      Store.recordCompletion('workout', durationSec, kcal);
      Screens.showWorkoutSummary({ durationSec, kcal });
    },

    teardown() {
      Engine.cancelLoop();
      FX.releaseWakeLock();
      Engine.running = false;
      Engine.paused = false;
      Engine.mode = null;
      Engine.ui = {};
    },

    // ---- BIKE ----
    bike: { running: false, paused: false, endsAt: 0, remainingFrozen: 0,
            rafId: null, startedAt: 0, minutes: 30, ui: {} },

    startBike(minutes) {
      Engine.bike.minutes = minutes;
      Engine.bike.running = true;
      Engine.bike.paused = false;
      Engine.bike.startedAt = Date.now();
      Engine.bike.endsAt = Date.now() + minutes * 60 * 1000;
      Engine.mode = 'bike';
      FX.ensureAudio();
      FX.requestWakeLock();
      Engine.bikeLoop();
      Screens.renderBikeRunning();
    },

    bikeLoop() {
      if (!Engine.bike.running || Engine.bike.paused) return;
      const remainingMs = Engine.bike.endsAt - Date.now();
      if (remainingMs <= 0) {
        Engine.finishBike();
        return;
      }
      Screens.updateBikeCountdown(Math.ceil(remainingMs / 1000));
      Engine.bike.rafId = requestAnimationFrame(Engine.bikeLoop);
    },

    pauseBike() {
      if (Engine.bike.paused || !Engine.bike.running) return;
      Engine.bike.paused = true;
      Engine.bike.remainingFrozen = Math.max(0, Math.ceil((Engine.bike.endsAt - Date.now()) / 1000));
      if (Engine.bike.rafId) cancelAnimationFrame(Engine.bike.rafId);
      Engine.bike.rafId = null;
      FX.releaseWakeLock();
      Screens.updateBikePauseUI(true);
    },

    resumeBike() {
      if (!Engine.bike.paused) return;
      Engine.bike.paused = false;
      Engine.bike.endsAt = Date.now() + Engine.bike.remainingFrozen * 1000;
      FX.requestWakeLock();
      Engine.bikeLoop();
      Screens.updateBikePauseUI(false);
    },

    togglePauseBike() { Engine.bike.paused ? Engine.resumeBike() : Engine.pauseBike(); },

    stopBike(saveProgress) {
      if (Engine.bike.rafId) cancelAnimationFrame(Engine.bike.rafId);
      Engine.bike.rafId = null;
      const elapsedSec = Math.round((Date.now() - Engine.bike.startedAt) / 1000);
      const w = Store.getWeight();
      const kcal = Math.round(BIKE_MET * w * (elapsedSec / 3600));
      Engine.bike.running = false;
      FX.releaseWakeLock();
      Engine.mode = null;
      if (saveProgress && elapsedSec >= 60) {
        Store.recordCompletion('bike', elapsedSec, kcal);
      }
      return { durationSec: elapsedSec, kcal };
    },

    finishBike() {
      if (Engine.bike.rafId) cancelAnimationFrame(Engine.bike.rafId);
      Engine.bike.rafId = null;
      const elapsedSec = Engine.bike.minutes * 60;
      const w = Store.getWeight();
      const kcal = Math.round(BIKE_MET * w * (Engine.bike.minutes / 60));
      Engine.bike.running = false;
      FX.releaseWakeLock();
      FX.signalFinish();
      Engine.mode = null;
      Store.recordCompletion('bike', elapsedSec, kcal);
      Screens.showBikeSummary({ durationSec: elapsedSec, kcal });
    },
  };

    renderActiveStep(step) {
      const u = Engine.ui;
      if (!u || !u.gifWrap) return;

      // step counter & block name
      const totalSteps = Engine.steps.length - 1; // exclude 'done'
      u.stepCounter.textContent = `Adım ${Math.min(step.index + 1, totalSteps)} / ${totalSteps}`;
      const block = BLOCK_BY_KEY[step.blockKey];
      u.blockName.textContent = block ? block.name : '';

      // progress bar based on step index
      const ratio = step.index / totalSteps;
      u.progressBar.style.width = `${Math.min(100, Math.max(0, ratio * 100))}%`;

      u.title.textContent = step.label || '';
      let sub = step.sublabel || '';
      if (step.round && step.totalRounds) sub += `  ·  Tur ${step.round}/${step.totalRounds}`;
      if (step.set && step.totalSets)     sub += `  ·  Set ${step.set}/${step.totalSets}`;
      u.sublabel.textContent = sub;

      // GIF
      clearGifTimerOn(u.gifWrap.firstElementChild);
      const newGif = step.exerciseId ? gifBox(step.exerciseId)
                                     : el('div', { class: 'w-full aspect-video rounded-xl bg-brand-50 dark:bg-brand-900/30 flex items-center justify-center text-brand-700 dark:text-brand-300 text-3xl font-bold' }, ['Dinlenme']);
      u.gifWrap.replaceChildren(newGif);

      // Counter — hidden for reps (the rep target lives in sublabel); shown for timed steps
      if (step.kind === 'reps') {
        u.counter.classList.add('hidden');
        u.counter.textContent = '';
      } else {
        u.counter.classList.remove('hidden');
        if (step.kind === 'hold') {
          u.counter.textContent = String(step.holdSec);
        } else {
          u.counter.textContent = fmtMMSS(step.duration);
        }
      }

      // sub-round for hold
      if (step.kind === 'hold') {
        const phase = Engine.inHoldRest ? 'Mola' : 'Tutuş';
        u.subRoundEl.textContent = `${phase} ${Engine.subRound}/${step.rounds}`;
      } else if (step.kind === 'work') {
        u.subRoundEl.textContent = 'Çalış';
      } else if (step.kind === 'rest') {
        u.subRoundEl.textContent = 'Dinlen';
      } else {
        u.subRoundEl.textContent = '';
      }

      // Tips
      u.tips.replaceChildren();
      const ex = step.exerciseId ? EXERCISES[step.exerciseId] : null;
      const tipsList = ex ? ex.tips : (step.kind === 'rest' ? ['Nefes al, su iç', 'Pozisyonunu hazırla'] : []);

        u.doneBtn.classList.remove('hidden');
        u.skipBtn.classList.add('hidden');

        u.doneBtn.classList.add('hidden');
        u.skipBtn.classList.remove('hidden');

      u.kcalEl.textContent = String(Engine.computeLiveKcal());

        ]),

        el('section', {}, [
          el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2' }, ['Son 8 hafta']),
          el('div', { class: 'flex gap-1 overflow-x-auto pb-1' }, weeks.map(week => {
            return el('div', { class: 'flex flex-col gap-1' }, week.map(cell => {
              const today = todayISO();
              const isPast = cell.iso <= today;
              let cls = 'bg-slate-200 dark:bg-slate-800';
              if (cell.done)         cls = 'bg-brand-600 dark:bg-brand-500';
              else if (!isPast)      cls = 'bg-slate-100 dark:bg-slate-800/40';
              return el('div', {
                class: `w-4 h-4 rounded-sm ${cls}`,
                title: cell.iso + (cell.done ? ' · ✓' : ''),
              });
            }));
          })),
          el('div', { class: 'mt-2 text-xs text-slate-500 dark:text-slate-400 flex items-center gap-2' }, [
            el('span', { class: 'inline-block w-3 h-3 rounded-sm bg-brand-600 dark:bg-brand-500' }),
            el('span', {}, ['Tamamlanan gün']),
          ]),
        ]),

        recentSessionsList(),
      ]);
      return root;
    },

    // ---- BIKE ----
    bike() {
      const root = el('div', { class: 'space-y-5' }, [
        el('header', { class: 'flex items-center justify-between' }, [
          el('div', {}, [
            el('h1', { class: 'text-xl font-bold' }, ['Bisiklet']),
            el('div', { class: 'text-xs text-slate-500 dark:text-slate-400' }, ['Hafif–orta tempo · ağrı yapmayan vites']),
          ]),
          el('a', {
            href: '#home',
            class: 'tap px-3 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800',
          }, ['‹ Ana']),
        ]),

        el('div', { class: 'rounded-xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-4' }, [
          el('div', { class: 'text-sm text-slate-500 dark:text-slate-400 mb-2' }, ['Süre seç']),
          el('div', { class: 'grid grid-cols-2 gap-2' }, [
            bikeStartButton(30),
            bikeStartButton(45),
          ]),
        ]),

        el('div', { class: 'rounded-xl bg-brand-50 dark:bg-brand-900/30 p-4 text-sm text-brand-800 dark:text-brand-200' }, [
          'Pedalı menüsküs için rahat bir vitesle çevir. Sertlik veya ağrı hissedersen vitesi azalt veya bırak.',
        ]),
      ]);
      return root;
    },

    renderBikeRunning() {
      const counter = el('div', {
        class: 'text-7xl font-bold tab-num text-center text-slate-900 dark:text-slate-50',
      }, [fmtMMSS(Engine.bike.minutes * 60)]);
      const pauseBtn = el('button', {
        class: 'tap flex-1 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-100 font-medium px-3 py-3 hover:bg-slate-300 dark:hover:bg-slate-700 transition',
        onclick: () => Engine.togglePauseBike(),
      }, ['Duraklat ⏸']);
      const stopBtn = el('button', {
        class: 'tap flex-1 rounded-xl bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200 font-medium px-3 py-3 hover:bg-red-200 dark:hover:bg-red-900/60 transition',
        onclick: () => {
          if (confirm('Bisikleti bitir ve mevcut süreyi kaydet?')) {
            const r = Engine.stopBike(true);
            Screens.showBikeSummary(r);
          }
        },
      }, ['Bitir']);

      const node = el('div', { class: 'space-y-5 pt-8' }, [
        el('div', { class: 'text-center text-sm text-brand-700 dark:text-brand-300 font-medium' }, [`Bisiklet · ${Engine.bike.minutes} dk`]),
        counter,
        el('div', { class: 'flex items-center justify-between text-sm' }, [
          el('span', { class: 'text-slate-500 dark:text-slate-400' }, ['Tahmini kcal']),
          el('span', { class: 'tab-num font-semibold text-brand-700 dark:text-brand-300' }, [
            String(Math.round(BIKE_MET * Store.getWeight() * (Engine.bike.minutes / 60))),
            ' kcal',
          ]),
        ]),
        el('div', { class: 'grid grid-cols-2 gap-2' }, [pauseBtn, stopBtn]),
        el('p', { class: 'text-center text-xs text-slate-500 dark:text-slate-400' }, ['Sayaç bitince titreşim ve sinyal duyacaksın.']),
      ]);
      document.getElementById('app').replaceChildren(node);
      Engine.bike.ui = { counter, pauseBtn };
    },

    updateBikeCountdown(secs) {
      if (Engine.bike.ui && Engine.bike.ui.counter) {
        Engine.bike.ui.counter.textContent = fmtMMSS(secs);
      }
    },

    updateBikePauseUI(paused) {
      if (Engine.bike.ui && Engine.bike.ui.pauseBtn) {
        Engine.bike.ui.pauseBtn.textContent = paused ? 'Devam Et ▶' : 'Duraklat ⏸';
      }
    },

    showBikeSummary({ durationSec, kcal }) {
      const node = el('div', { class: 'min-h-[60vh] flex flex-col items-center justify-center text-center space-y-4' }, [
        el('div', { class: 'text-6xl' }, ['🚴']),
        el('h1', { class: 'text-2xl font-bold' }, ['Bisiklet tamam!']),
        el('div', { class: 'grid grid-cols-2 gap-2 w-full max-w-md mt-2' }, [
          statCard(fmtDuration(durationSec), 'süre'),
          statCard(kcal, 'kcal'),
        ]),
        el('div', { class: 'flex gap-2 w-full max-w-md mt-3' }, [
          el('a', {
            href: '#progress',
            class: 'tap flex-1 rounded-xl bg-brand-600 text-white text-center font-semibold px-4 py-3 hover:bg-brand-700 transition',
          }, ['İlerlemeyi gör']),
          el('a', {
            href: '#home',
            class: 'tap flex-1 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-center font-medium px-4 py-3 hover:bg-slate-300 dark:hover:bg-slate-700 transition',
          }, ['Ana ekran']),
        ]),
      ]);
      document.getElementById('app').replaceChildren(node);
    },
  };

  // Small components
  function statCard(value, label) {
    return el('div', { class: 'rounded-xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 px-3 py-3' }, [
      el('div', { class: 'text-xl font-bold tab-num' }, [String(value)]),
      el('div', { class: 'text-[11px] uppercase tracking-wide text-slate-500 dark:text-slate-400' }, [label]),
    ]);
  }

  function bikeStartButton(minutes) {
    const w = Store.getWeight();
    const kcal = Math.round(BIKE_MET * w * (minutes / 60));
    return el('button', {
      class: 'tap rounded-xl bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-semibold px-4 py-4 transition flex flex-col items-center',
      onclick: () => {
        FX.ensureAudio();
        Engine.startBike(minutes);
      },
    }, [
      el('span', { class: 'text-2xl' }, [`${minutes} dk`]),
      el('span', { class: 'text-xs opacity-90 mt-0.5' }, [`~${kcal} kcal`]),
    ]);
  }

  function exerciseCard(id) {
    const ex = EXERCISES[id];
    let doneTag, card;

    const checkBtn = el('button', {
      class: 'tap w-full rounded-lg px-3 py-2 text-sm font-medium transition ' +
             (checkedExercises.has(id)
               ? 'bg-brand-600 text-white'
               : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-brand-100 dark:hover:bg-brand-900/40 hover:text-brand-700 dark:hover:text-brand-300'),
      onclick: (e) => {
        e.stopPropagation();
        if (checkedExercises.has(id)) checkedExercises.delete(id);
        else checkedExercises.add(id);
        const done = checkedExercises.has(id);
        checkBtn.textContent = done ? '✓ Tamamlandı' : 'Tamamlandı işaretle';
        checkBtn.className = 'tap w-full rounded-lg px-3 py-2 text-sm font-medium transition ' +
          (done ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-brand-100 dark:hover:bg-brand-900/40 hover:text-brand-700 dark:hover:text-brand-300');
        doneTag.classList.toggle('hidden', !done);
        card.className = 'rounded-xl bg-white dark:bg-slate-900 p-3 ' +
          (done ? 'ring-2 ring-brand-500' : 'ring-1 ring-slate-200 dark:ring-slate-800');
      },
    }, [checkedExercises.has(id) ? '✓ Tamamlandı' : 'Tamamlandı işaretle']);

    const detail = el('div', { class: 'hidden pt-3 space-y-3' }, [
      el('div', { class: 'grid grid-cols-1 sm:grid-cols-2 gap-3' }, [
        gifBox(id),
        el('ul', { class: 'space-y-1.5 text-sm text-slate-700 dark:text-slate-300 list-disc list-inside' },
          ex.tips.map(t => el('li', {}, [t])),
        ),
      ]),
      checkBtn,
    ]);

    doneTag = el('span', {
      class: (checkedExercises.has(id) ? '' : 'hidden ') +
             'ml-1.5 text-sm font-semibold text-brand-600 dark:text-brand-400',
    }, ['✓']);

    const chev = el('span', { class: 'text-slate-400 transition-transform' }, ['▾']);
    const btn = el('button', {
      class: 'tap w-full flex items-center gap-3 text-left',
      onclick: () => {
        const hidden = detail.classList.toggle('hidden');
        chev.style.transform = hidden ? '' : 'rotate(180deg)';
      },
    }, [
      el('div', { class: 'flex-1' }, [
        el('div', { class: 'font-semibold flex items-center flex-wrap gap-x-0.5' }, [ex.name, doneTag]),
        el('div', { class: 'text-xs text-slate-500 dark:text-slate-400' }, [modeText(ex)]),
      ]),
      chev,
    ]);

    card = el('div', {
      class: 'rounded-xl bg-white dark:bg-slate-900 p-3 ' +
             (checkedExercises.has(id) ? 'ring-2 ring-brand-500' : 'ring-1 ring-slate-200 dark:ring-slate-800'),
    }, [btn, detail]);
    return card;
  }

  function modeText(ex) {
    if (ex.mode === 'time')     return `${ex.duration} sn`;
    if (ex.mode === 'reps')     return ex.repText;
    if (ex.mode === 'hold')     return `${ex.holdSec} sn × ${ex.rounds}`;
    if (ex.mode === 'interval') return `${ex.workSec} sn çalış / ${ex.restSec} sn dinlen`;
    return '';
  }

  function recentSessionsList() {
    const data = Store.load();
    const recent = [...data.completions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7);
    if (recent.length === 0) {
      return el('section', {}, [
        el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2' }, ['Son oturumlar']),
        el('div', { class: 'rounded-xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 p-4 text-sm text-slate-500 dark:text-slate-400 text-center' },
          ['Henüz kayıt yok. İlk antrenmanını yap!']),
      ]);
    }
    return el('section', {}, [
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2' }, ['Son oturumlar']),
      el('ul', { class: 'rounded-xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 divide-y divide-slate-100 dark:divide-slate-800' },
        recent.map(s => el('li', { class: 'flex items-center justify-between px-4 py-3 text-sm' }, [
          el('div', {}, [
            el('div', { class: 'font-medium' }, [s.type === 'workout' ? 'Antrenman' : 'Bisiklet']),
            el('div', { class: 'text-xs text-slate-500 dark:text-slate-400' }, [s.date]),
          ]),
          el('div', { class: 'text-right' }, [
            el('div', { class: 'tab-num' }, [fmtDuration(s.durationSec)]),
            el('div', { class: 'text-xs text-slate-500 dark:text-slate-400 tab-num' }, [`${s.kcal || 0} kcal`]),
          ]),
        ])),
      ),
    ]);
  }

  // -----------------------------------------------------------------------------
  // ROUTER
  // -----------------------------------------------------------------------------
  const Router = {
    routes: {
      '':           () => Screens.home(),
      '#home':      () => Screens.home(),
      '#exercises': () => Screens.exerciseList(),
      '#workout':   () => null, // Engine.startWorkout mounts itself
      '#progress':  () => Screens.progress(),
      '#bike':      () => Screens.bike(),
    },
    current: null,

    handle() {
      let hash = location.hash || '';
      clearAllGifTimers();
      // Leaving workout/bike screens — cleanup if engine running
      if (Router.current === '#workout' && hash !== '#workout' && Engine.running) {
        if (!confirm('Antrenmandan çıkmak istiyor musun? İlerleme kaydedilmeyecek.')) {
          history.replaceState(null, '', '#workout');
          return;
        }
        Engine.teardown();
      }
      if (Router.current === '#bike' && hash !== '#bike' && Engine.bike.running) {
        Engine.stopBike(false);
      }

      // Safety: arriving at #workout without an active engine — redirect home
      if (hash === '#workout' && !Engine.running) {
        history.replaceState(null, '', '#home');
        hash = '#home';
      }

      Router.current = hash;
      const fn = Router.routes[hash] || Router.routes[''];
      const node = fn();
      if (node) document.getElementById('app').replaceChildren(node);

      // Update nav state
      document.querySelectorAll('[data-nav]').forEach(a => {
        const active = ('#' + a.dataset.nav === hash) ||
                       (hash === '' && a.dataset.nav === 'home');
        a.classList.toggle('text-brand-600', active);
        a.classList.toggle('dark:text-brand-300', active);
        a.classList.toggle('text-slate-500', !active);
        a.classList.toggle('dark:text-slate-400', !active);
      });

      window.scrollTo({ top: 0, behavior: 'instant' });
    },
  };

  // -----------------------------------------------------------------------------
  // INLINE PWA MANIFEST + ICON
  // -----------------------------------------------------------------------------
  function setupManifest() {
    const iconSvg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
      '<rect width="192" height="192" rx="40" fill="#0d9488"/>' +
      '<path d="M96 152s-44-28-44-64a24 24 0 0 1 44-16 24 24 0 0 1 44 16c0 36-44 64-44 64z" fill="#fff"/>' +
      '</svg>';
    const manifest = {
      name: 'Menüsküs Rehab',
      short_name: 'Rehab',
      description: 'Menüsküs tamiri sonrası rehabilitasyon + HIIT programı',
      start_url: '.',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#0f172a',
      theme_color: '#0d9488',
      lang: 'tr',
      icons: [{
        src: 'data:image/svg+xml;utf8,' + encodeURIComponent(iconSvg),
        sizes: '192x192 512x512 any',
        type: 'image/svg+xml',
        purpose: 'any maskable',
      }],
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' +
                encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);

    // Favicon (also helps PWA)
    const fav = document.createElement('link');
    fav.rel = 'icon';
    fav.type = 'image/svg+xml';
    fav.href = 'data:image/svg+xml;utf8,' + encodeURIComponent(iconSvg);
    document.head.appendChild(fav);
  }

  // -----------------------------------------------------------------------------
  // VISIBILITY: re-acquire wake lock when returning to foreground
  // -----------------------------------------------------------------------------
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if ((Engine.running && !Engine.paused) ||
          (Engine.bike.running && !Engine.bike.paused)) {
        FX.requestWakeLock();
      }
    }
  });

  // -----------------------------------------------------------------------------
  // APP INIT
  // -----------------------------------------------------------------------------
  const App = {
    init() {
      setupManifest();
      window.addEventListener('hashchange', Router.handle);
      Router.handle();
    },
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.init);
  } else {
    App.init();
  }
})();
</script>
</body>
</html>
